name: Browser and choreo import tests

on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'shared/**'
      - 'tests/**'
      - '.github/workflows/browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/requirements.txt -r analyzer/requirements.txt imageio-ffmpeg==0.8.1
      - run: python -m playwright install --with-deps chromium
      - name: Locate test media tools
        run: |
          python - <<'PY'
          import os
          from playwright.sync_api import sync_playwright
          from imageio_ffmpeg import get_ffmpeg_exe
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              with sync_playwright() as p:
                  output.write('CHROMIUM_PATH='+p.chromium.executable_path+'\n')
              output.write('FFMPEG_PATH='+get_ffmpeg_exe()+'\n')
          PY
      - run: node tests/choreo.test.cjs
      - run: node tests/zoom.test.cjs
      - run: node tests/preview.test.cjs
      - run: python -m unittest discover -s tests -p test_choreo_browser_contract.py -v
      - run: python -m unittest discover -s tests -p test_choreo_browser.py -v
      - run: python -m unittest discover -s tests -p test_camera.py -v
      - run: python -m unittest discover -s tests -p test_zoom.py -v
