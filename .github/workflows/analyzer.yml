name: Analyzer contract tests

on:
  pull_request:
    paths:
      - 'analyzer/**'
      - 'shared/**'
      - 'tests/test_analyzer.py'
      - 'tests/test_choreo.py'
      - 'tests/test_export_poses.py'
      - 'tests/test_model_comparison.py'
      - 'tests/preview.test.cjs'
      - 'tests/fixtures/**'
      - '.github/workflows/analyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
          cache-dependency-path: 'analyzer/requirements*.txt'
      - run: python -m pip install -r analyzer/requirements-analysis.txt
      - run: python -m pip check
      - run: python -m unittest discover -s tests -p test_analyzer.py -v
      - run: python -m unittest discover -s tests -p test_choreo.py -v
      - run: python -m unittest discover -s tests -p test_export_poses.py -v
      - run: python -m unittest discover -s tests -p test_model_comparison.py -v
      - run: node tests/preview.test.cjs
      - run: python -m analyzer.validate tests/fixtures/synthetic.choreo
